[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunaris-dense-irl2"
version = "0.4.0"
description = "A clean dense causal language model built around anchored IRL-2 refinement."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
monitoring = ["wandb>=0.19"]

[project.scripts]
lunaris-train = "lunaris_dense_irl2.training.train:main"
lunaris-core-train = "lunaris_dense_irl2.training.train:main"
lunaris-export = "lunaris_dense_irl2.training.export_checkpoint:main"
lunaris-preflight = "lunaris_dense_irl2.training.preflight:main"

[tool.setuptools.packages.find]
include = [
    "lunaris_dense_irl2*",
    "lunaris_dense_irl_core*",
    "lunaris_dense_transformer*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
