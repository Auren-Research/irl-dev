model_profile: "../profiles/irl3_debug.yaml"

data:
  train_dir: "data/debug/train"
  validation_dir: "data/debug/validation"
  sequence_length: 16
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2
  mmap_cache_size: 2
  shuffle: true
  seed: 1337

optimizer:
  name: "adamw"
  learning_rate: 0.001
  weight_decay: 0.1
  fused: "false"

schedule:
  name: "wsd"
  warmup_steps: 1
  stable_steps: 1
  decay_steps: 1
  min_lr_ratio: 0.1

parallel:
  strategy: "none"
  precision: "fp32"
  reduce_dtype: "fp32"
  compile: false
  regional_compile: false

training:
  micro_batch_size: 2
  gradient_accumulation_steps: 1
  max_steps: 3
  seed: 1337
  gradient_clip: 1.0
  loss_chunk_size: 16
  loss_backend: "chunked"
  z_loss_coefficient: 0.0001

objectives:
  compute_start_steps: 2
  compute_ramp_steps: 2
  depth_sampling: "uniform"
  gradient_horizon_start: 2
  gradient_horizon_ramp_steps: 2
  ponder_weight: 0.001
  ponder_warmup_steps: 1
  ponder_ramp_steps: 1
  equilibrium_weight: 0.001
  equilibrium_warmup_steps: 0
  equilibrium_ramp_steps: 1
  mtp_loss_weight: 0.2
  mtp_warmup_steps: 0
  mtp_ramp_steps: 1
  mtp_horizon_interval: 1
  mtp_horizon_decay: 0.7

validation:
  interval: 2
  batches: 2
  at_start: true

checkpoint:
  directory: "checkpoints/irl3_debug"
  interval: 2
  keep_last: 2
  async_save: false
  resume: "none"
  save_final: true

logging:
  interval: 1
  jsonl_path: "checkpoints/irl3_debug/metrics.jsonl"
  wandb_project: null
  profile_steps: 0
