model_profile: "../profiles/135m_mi300x_qualification.yaml"
model:
  use_gradient_checkpointing: false
  track_irl_stats: false

data:
  train_dir: "data/qualification/train"
  validation_dir: "data/qualification/validation"
  sequence_length: 4096
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  mmap_cache_size: 2
  shuffle: true
  seed: 7331

optimizer:
  name: "adamw"
  learning_rate: 0.0006
  weight_decay: 0.1
  fused: "auto"

schedule:
  name: "wsd"
  warmup_steps: 20
  stable_steps: 40
  decay_steps: 20
  min_lr_ratio: 0.1

parallel:
  strategy: "none"
  precision: "bf16"
  reduce_dtype: "fp32"
  compile: false
  regional_compile: true

training:
  micro_batch_size: 4
  gradient_accumulation_steps: 1
  max_steps: 80
  max_tokens: 1310720
  seed: 7331
  gradient_clip: 1.0
  loss_chunk_size: 1024
  loss_backend: "chunked"
  z_loss_coefficient: 0.0001
  fail_on_nonfinite: true

objectives:
  irl_start_iters: 1
  irl_ramp_steps: 20
  irl_consistency_weight: 0.01
  irl_consistency_warmup_steps: 10
  irl_consistency_ramp_steps: 20
  mtp_loss_weight: 0.2
  mtp_warmup_steps: 10
  mtp_ramp_steps: 20
  mtp_horizon_interval: 20
  mtp_horizon_decay: 0.7

validation:
  interval: 40
  batches: 8
  at_start: true

checkpoint:
  directory: "qualification_artifacts/irl3/checkpoints/irl2_baseline"
  interval: 80
  keep_last: 1
  async_save: false
  resume: "auto"
  save_final: true

logging:
  interval: 5
  jsonl_path: "qualification_artifacts/irl3/irl2_baseline_metrics.jsonl"
  wandb_project: null
  profile_steps: 0
