model_profile: "../profiles/irl_core_135m.yaml"

data:
  train_dir: "data/irl_core_smoke/train"
  validation_dir: null
  sequence_length: 4096
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  mmap_cache_size: 1
  shuffle: true
  seed: 1337

optimizer:
  name: "adamw"
  learning_rate: 0.0003
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8
  fused: "auto"

schedule:
  name: "wsd"
  warmup_steps: 1
  stable_steps: 3
  decay_steps: 1
  min_lr_ratio: 0.1
  decay_shape: "cosine"

parallel:
  strategy: "none"
  precision: "bf16"
  reduce_dtype: "fp32"
  compile: false
  regional_compile: true

training:
  micro_batch_size: 2
  gradient_accumulation_steps: 4
  max_steps: 5
  seed: 1337
  gradient_clip: 1.0
  gradient_clip_mode: "global"
  loss_chunk_size: 512
  loss_backend: "chunked"
  z_loss_coefficient: 1.0e-4
  fail_on_nonfinite: true

objectives:
  irl_start_iters: 6
  irl_ramp_steps: 0
  irl_consistency_weight: 0.0
  irl_consistency_warmup_steps: 0
  irl_consistency_ramp_steps: 0
  mtp_loss_weight: 0.0
  mtp_warmup_steps: 0
  mtp_ramp_steps: 0
  mtp_horizon_interval: 0
  mtp_horizon_decay: 0.7

validation:
  interval: 0
  batches: 0
  at_start: false

checkpoint:
  directory: "remote_artifacts/135m_training_checkpoints"
  interval: 0
  keep_last: 1
  async_save: false
  resume: "none"
  save_final: false

logging:
  interval: 1
  jsonl_path: "remote_artifacts/135m_training_metrics.jsonl"
  wandb_project: null
  profile_steps: 0
  peak_tflops_per_gpu: null
