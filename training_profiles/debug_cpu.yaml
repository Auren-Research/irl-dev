model:
  vocab_size: 257
  d_model: 64
  n_layers: 2
  n_heads: 4
  n_kv_heads: 2
  ffn_hidden_dim: 96
  max_seq_len: 32
  attention_pattern: "LG"
  local_window: 8
  irl_train_iters: 2
  irl_eval_iters: 2
  mtp_num_heads: 2
  mtp_irl_iters: 1
  mtp_ffn_hidden_dim: 64
  dropout: 0.0
  attention_dropout: 0.0

data:
  train_dir: "data/debug/train"
  validation_dir: "data/debug/validation"
  sequence_length: 16
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2
  mmap_cache_size: 2
  shuffle: true
  seed: 1337

optimizer:
  name: "adamw"
  learning_rate: 0.001
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8
  fused: "false"

schedule:
  name: "wsd"
  warmup_steps: 1
  stable_steps: 1
  decay_steps: 1
  min_lr_ratio: 0.1
  decay_shape: "cosine"

parallel:
  strategy: "none"
  precision: "fp32"
  reduce_dtype: "fp32"
  compile: false

training:
  micro_batch_size: 2
  gradient_accumulation_steps: 2
  max_steps: 3
  seed: 1337
  gradient_clip: 1.0
  gradient_clip_mode: "global"
  loss_chunk_size: 16
  loss_backend: "chunked"
  z_loss_coefficient: 1.0e-4

objectives:
  irl_start_iters: 1
  irl_ramp_steps: 2
  irl_consistency_weight: 0.01
  irl_consistency_warmup_steps: 1
  irl_consistency_ramp_steps: 1
  mtp_loss_weight: 0.2
  mtp_warmup_steps: 0
  mtp_ramp_steps: 1
  mtp_horizon_interval: 1
  mtp_horizon_decay: 0.7

validation:
  interval: 2
  batches: 2
  at_start: true

checkpoint:
  directory: "checkpoints/debug"
  interval: 2
  keep_last: 2
  async_save: false
  resume: "none"
  save_final: true

logging:
  interval: 1
  jsonl_path: "checkpoints/debug/metrics.jsonl"
  wandb_project: null
  profile_steps: 0
